[project]
name = "psd-laruen"
version = "0.1.0"
description = "Neural Dsp rip off"
readme = "README.md"
authors = [
    { name = "Realchop", email = "jovanovic.lazar002@gmail.com" },
    { name = "VailenVoid", email = "vasilije.ivanovic.mldl@gmail.com" }
]
requires-python = ">=3.11, <3.12"
dependencies = [
    "lightning>=2.6.5",
    "pedalboard",
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

[project.scripts]
main = "psd_laruen.main:main"
play = "psd_laruen.main:play"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingTypeStubs = true

[tool.ruff.lint]
ignore = ["PLR0402"]

[tool.uv.sources]
pedalboard = { path = "vendor/pedalboard-0.9.24-cp311-cp311-linux_x86_64.whl" }

